name: Update release README
on:
  release:
    types: [published, released, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: update-release-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the latest stable downloads and release notes
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.repository.default_branch;
            const path = 'README.md';
            const begin = '<!-- latest-release:start -->';
            const end = '<!-- latest-release:end -->';
            const platforms = [
              [/\.exe$/i, 'Windows', '설치 프로그램을 실행하세요.'],
              [/mac-arm64\.zip$/i, 'macOS 13 이상 · Apple Silicon', 'ZIP을 풀고 앱을 응용 프로그램 폴더로 옮기세요.'],
              [/mac-x64\.zip$/i, 'macOS 13 이상 · Intel', 'ZIP을 풀고 앱을 응용 프로그램 폴더로 옮기세요.'],
              [/\.deb$/i, 'Ubuntu', 'DEB 패키지를 설치하세요.']
            ];

            function releaseSection(release) {
              if (!release) return '아직 공개된 정식 버전이 없습니다.';
              const lines = [
                `**최신 버전 [${release.tag_name}](${release.html_url})**`, '',
                '| 운영체제 | 설치 파일 | 설치 방법 |', '| --- | --- | --- |'
              ];
              for (const [pattern, platform, instructions] of platforms) {
                for (const asset of release.assets.filter(a => a.state === 'uploaded' && pattern.test(a.name))) {
                  lines.push(`| ${platform} | [${asset.name}](${asset.browser_download_url}) | ${instructions} |`);
                }
              }
              if (lines.length === 4) lines.splice(2, 2, '설치 파일은 릴리스 페이지에서 확인하세요.');
              const notes = (release.body || '').split(/^#{1,6}\s+SHA[- ]?256\b/im)[0].trim();
              if (notes) lines.push('', '### 이번 버전의 변경 사항', '', notes);
              lines.push('', `[모든 릴리스 보기](https://github.com/${owner}/${repo}/releases)`);
              return lines.join('\n');
            }

            for (let attempt = 1; attempt <= 3; attempt++) {
              const file = (await github.rest.repos.getContent({owner, repo, path, ref: branch})).data;
              const before = Buffer.from(file.content, 'base64').toString('utf8');
              const start = before.indexOf(begin);
              const finish = before.indexOf(end);
              if (start < 0 || finish < start || start !== before.lastIndexOf(begin) || finish !== before.lastIndexOf(end)) {
                throw new Error('README release markers are missing or duplicated.');
              }
              let latest;
              try {
                latest = (await github.rest.repos.getLatestRelease({owner, repo})).data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const section = releaseSection(latest);
              if (section.includes(begin) || section.includes(end)) throw new Error('Release notes contain a README marker.');
              const after = before.slice(0, start + begin.length) + '\n' + section + '\n' + before.slice(finish);
              if (after === before) {
                core.info('README is already current.');
                return;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({owner, repo, path, branch, sha: file.sha,
                  message: `Update downloads in README${latest ? ' for ' + latest.tag_name : ''}`,
                  content: Buffer.from(after).toString('base64')});
                return;
              } catch (error) {
                if (error.status !== 409 || attempt === 3) throw error;
              }
            }
